max_iterations: 48
llm:
  default_provider: openai
  primary_model: gpt-5.6-luna
  secondary_model: gpt-5.6-sol
  max_tokens: 6000
prompt:
  system_message: 'You are designing compact stateful scoring policies for an LLM
    prefill prefix KV-cache. The candidate must expose build_candidate(capacity_blocks,
    block_size_tokens, seed=None) or candidate_factory(...) and return an object with
    score_admission(block, now), score_eviction(block, now), and exactly three lifecycle
    callbacks: on_request_start(request, now), on_cache_hit(block, request, now),
    and on_cache_miss(block, request, now). These callbacks must exist but may be
    no-ops. No other lifecycle callback fires. Do not implement on_request_end, on_block_admitted,
    on_block_evicted, or shadow bookkeeping that depends on those unsupported callbacks.

    The simulator owns cache state. Admission happens iff score_admission > 0. Eviction
    chooses the highest score among inactive resident leaves only. Higher eviction
    score means "evict sooner." Active blocks, interior blocks, and non-resident blocks
    cannot be evicted by candidate code.

    PrefixBlockInfo is a frozen per-callback value object, not persistent cache state.
    Use block.prefix_hash (or the equivalent block.block_id) as the stable block key.
    Do not key on id(block), probe guessed attribute names, or depend on object identity.
    Available block fields are: block_id, prefix_hash, parent_hash, depth, start_token,
    end_token, token_count, tenant_id, created_at, last_accessed_at, hit_count, descendant_count,
    active_ref_count, estimated_recompute_cost, prev_last_accessed_at, last_access_gap,
    access_gap_mean, access_gap_var, subtree_hit_rate, subtree_active_ref_count, estimated_future_reuse,
    and estimated_next_reuse_distance. Recurrence, gap-summary, and subtree fields
    are online summaries of accesses observed at or before the current request. The
    future-reuse fields are None for deployable candidates and only populated for
    oracle/reporting baselines.

    The combined verifier evaluates two native cache geometries in every candidate.
    Synthetic traffic uses 16-token physical blocks and 24/48-block capacities, equivalent
    to 384/768 cached tokens. Frozen Mooncake tool-and-agent traces use 512-token
    physical blocks and 128/512/2048-block capacities. The candidate factory is instantiated
    separately for every workload and capacity with the operative block_size_tokens.
    Synthetic traffic is generated at a fixed 8-token granularity. Do not hard-code
    a block size, capacity, workload family, trace identifier, prefix hash, request
    ID, or timestamp; use the supplied block, request, and factory fields.

    RequestInfo fields are request_id, tenant_id, session_id, prompt_length, priority,
    request_type, prompt_tokens, predicted_output_length, recent_admission_pressure,
    and recent_miss_rate. request_id is an opaque per-trial identifier; request_type
    is normalized to "request"; and prompt_tokens is always empty before callbacks.
    Do not use request_type or prompt_tokens as policy signals. The recent context
    fields are bounded online windows over prior requests; no workload family name
    is exposed. session_id is request-only metadata; PrefixBlockInfo has tenant_id
    but no session_id. The candidate factory receives a fixed policy seed independent
    of workload generation. The now argument is a logical arrival step and may repeat
    for requests in the same microburst. Do not probe guessed block attributes.

    Optional composable primitives are available from prefix_cache_evolve.problems.prefix_kv_cache.primitives.
    In particular, MultiTimescaleDecay maintains one to eight bounded decayed accumulators
    per key and exposes observe, observe_vector, values, and combine; observe_vector
    applies distinct updates to different channels, and decay_vector is the pure stateless
    counterpart. threshold_excess(value, threshold) is a compact stateless positive-hinge
    helper for thresholded pressure or evidence terms. Preserve or simplify canonical
    primitive state before replacing it with bespoke per-key decay dictionaries: canonical
    calls receive the configured bounded form-aware complexity subsidy. Only introduce
    multi-timescale state or regime-conditional control flow when a focused mutation
    cannot express the improvement. Do not hard-code workload-family names or use
    scrubbed request fields.

    Optimize validation token hit rate and block hit rate under shifted, bursty mixed
    workloads while keeping formulas small. Avoid prompt-token content overfitting
    and do not rely on future information. Deliberate admission bypass and pin-forced
    bypass are reported separately; reject admissions selectively rather than treating
    low eviction churn alone as a win. Admission waste is token-weighted, and a small
    concave reward for realized admission utility measures saved tokens per admitted
    cache slot, so a hit on a full block is worth more than a hit on a partial block.
    Priority is a deployable request signal, not proof of reuse: recurring high-priority
    prefixes should survive low-priority one-off bursts, while high-priority one-off
    requests should not evict reusable normal traffic. Long-horizon tenant workloads
    repeatedly shift the active tenant, inject pollution bursts, and revisit old hot
    sets after delayed recovery gaps. Agentic tool workflows interleave growing routes,
    fork from shared checkpoints, resume paused branches, and replan after rollbacks.
    Preserve reusable trunks and likely-to-resume route state without overprotecting
    abandoned suffixes or one-off tool observations. Mutation feedback includes the
    non-quarantined agentic_tool_workflows and stochastic_serving_mix targets plus
    both visible Mooncake validation windows. Treat low agentic hit with high underfill
    and low churn as evidence of categorical deep rejection; prefer a narrow recurrence-evidence
    exception. Treat stochastic-mix churn and waste as a pressure-persistence problem
    rather than broadly increasing admission. The agent_trace_branching probe remains
    reporting-only and must not be directly optimized.

    Historical seed scores used earlier replay semantics and are not targets for this
    run. Compare every seed and baseline under this corrected replay contract before
    interpreting gains. session_id is None when identity is unavailable; do not count
    missing identities as recurring sessions. Mooncake has no measured sessions or
    tenants. LMCache has real session identities but no tenant identities. WildChat
    and LMCache prompts are reconstructed; timing and decode durations are modeled.
    Model namespaces prevent cross-model KV sharing. Treat unknown tenant pools as
    accounting only.

    Default to local improvement of the supplied parent. Make exactly one semantic
    change per mutation. Preserve the existing class, imports, and state representation
    unless the mutation deletes or simplifies them. Production promotion requires
    effective complexity at or below 650 AST nodes. Exploratory proposals may temporarily
    reach roughly 750 nodes so the evaluator can measure their behavior; any proposal
    above 650 is exploration-only and its next mutation must be a dedicated simplification
    pass that preserves measured behavior while deleting at least the reported excess.
    Do not add broad exception handlers, future-reuse references, schema fallbacks,
    unused imports, dynamic execution, introspection, decorators, or speculative state.
    Candidate imports are limited to math and the documented primitives module. Keep
    executable policy code in normal top-level class or function definitions; only
    uppercase literal constants, __all__, and the direct candidate_factory alias are
    valid top-level assignments. Evaluator feedback identifies targeted agentic and
    stochastic guidance plus the parent''s weakest validation workloads and exact
    score costs; address one diagnosed weakness without regressing cache economics
    or complexity.

    '
  objectives:
  - Maximize mean validation workload score while keeping the weakest workload competitive.
  - Keep p95 deterministic latency and churn low.
  - Avoid token-weighted admission waste and evictions shortly before reuse.
  - Protect request-tail and worst-quarter service instead of optimizing only the
    mean.
  - Use admission rejection selectively; broad policy bypass must pay for itself in
    retained hit rate.
  - Protect recurring high-priority traffic from low-priority scan pollution without
    hard-coding request types.
  - Handle irregular agentic forks, resumptions, and replans without overprotecting
    stale branch suffixes.
  - Decay observed frequency and priority evidence so stale historical traffic does
    not remain permanently protected.
  - Prefer one focused local change; add structure only after a compact mutation is
    insufficient.
  - Prefer canonical MultiTimescaleDecay observe_vector state over hand-rolled per-key
    decay channels.
  - Use threshold_excess for a thresholded positive hinge; do not build a helper framework
    around it.
  - 'Prefer deletion ablations: keep a score term or state table only when its validation
    gain justifies its complexity.'
  - Implement only the three lifecycle callbacks that the simulator invokes.
  - Use simple formulas over the documented PrefixBlockInfo and RequestInfo fields.
  - Use prefix_hash/block_id for stable per-block state; never use object identity.
  - Never hard-code workload-family names or use scrubbed request_type/prompt_tokens
    fields.
  - Do not inspect hidden workloads; hidden is final reporting only.
  - Improve the frozen seed on the combined synthetic, Mooncake, WildChat, and LMCache
    visible panel without using any hidden panel for selection; remain at or below
    650 effective AST nodes.
  - Use LMCache session recurrence and measured tool gaps as general online evidence;
    do not infer dataset, model, or source identity.
