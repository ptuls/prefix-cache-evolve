    max_tokens: 6000
cvt:
  n_centroids: 8
  data_driven_centroids: true
behavior:
  ast_features:
  - cyclomatic_complexity
  - subscript_count
  score_keys:
  - validation_token_hit_rate
  - validation_policy_underfill_rate
  - validation_cache_churn_per_1k
  - validation_wasted_admission_token_rate
  - validation_avoidable_eviction_rate
  - train_workload_agentic_tool_workflows_token_hit_rate
  - validation_workload_stochastic_serving_mix_token_hit_rate
  - validation_workload_mooncake_toolagent_1_token_hit_rate
  - validation_workload_mooncake_toolagent_2_token_hit_rate
meta_advice:
  enabled: true
  interval: 12
  max_tokens: 500
pipeline:
  n_llm_workers: 2
  n_parents: 1
  n_inspirations: 0
  output_mode: diff
punctuated_equilibrium:
  enabled: true
  interval: 10
  n_clusters: 2
  n_variants: 1
  reasoning_effort: medium
  max_tokens: 6000
prompt_overrides:
  paradigm_shift: Produce one compact, block-size-aware online policy with a different core admission
    or eviction idea that can operate on both 16-token synthetic traffic and 512-token Mooncake agentic
    traces. Target at most 550 effective AST nodes, one policy class, and one bounded state table or documented
    primitive. Implement only the required interface. Use observed recurrence, pressure, depth, block_size_tokens,
    token_count, and recomputation cost rather than literal geometry or dataset identifiers. Preserve
    useful trunks, avoid stale suffixes, and delete unnecessary logic.
