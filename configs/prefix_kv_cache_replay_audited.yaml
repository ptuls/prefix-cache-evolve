prompt_overrides:
  paradigm_shift: Produce one compact, block-size-aware online policy with a different
    core admission or eviction idea that can operate on 16-token synthetic and WildChat
    traffic plus 512-token Mooncake production and LMCache collected agent traces.
    Target at most 550 effective AST nodes, one policy class, and one bounded state
    table or documented primitive. Implement only the required interface. Use observed
    recurrence, pressure, depth, block_size_tokens, token_count, recomputation cost,
    and access gaps rather than literal geometry or dataset identifiers. Preserve
    useful trunks, avoid stale suffixes, and delete unnecessary logic.
